# The `name:` below is referenced by release.yml's workflow_run trigger — keep in sync.
name: Refresh EQL Wiki commands data

# Continuous extraction of the slash-command reference from
# https://eqlwiki.com/Commands. Unlike the client-manual snapshot under
# src/data/eql-client (which needs a local game install and is maintainer-run
# only, see refresh docs in README.md), this source is a public wiki page
# reachable over plain HTTP, so scripts/extract-eql-wiki-commands.mjs can run
# unattended here on a schedule.

on:
  schedule:
    # Twice weekly, same cadence as refresh-eqlbuilds.yml, offset by an hour
    # so the two extractors don't race for the same commit.
    - cron: "0 1 * * 3"
    - cron: "0 1 * * 5"
  workflow_dispatch:
    inputs:
      commit:
        description: "Commit refreshed data if it changed"
        type: boolean
        default: true

permissions:
  contents: write

# Shares release.yml's group so a refresh never runs concurrently with a
# release (whose push has no rebase) or with another refresh.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Gate on the extractor's own --check, which ignores volatile fields
      # (extraction timestamp) and only reports real data changes, so an
      # unchanged upstream never produces a no-op commit. Exit 10 means "data
      # changed"; any other nonzero exit is a crashed extraction and fails the
      # job instead of being mistaken for a change.
      - name: Detect upstream changes
        id: diff
        run: |
          set +e
          npm run --silent extract:wiki-commands:check
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          elif [ "$code" -eq 10 ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "extract:wiki-commands:check failed with exit $code" >&2
            exit "$code"
          fi

      - name: Extract latest EQL Wiki commands data
        if: steps.diff.outputs.changed == 'true'
        run: |
          npm run extract:wiki-commands
          git --no-pager diff --stat -- src/data/eql-wiki

      # Validate the freshly-extracted snapshot before it can be committed, so
      # a bad extraction (e.g. the wiki page layout changing) never lands on
      # main — the extractor already fails loudly if it parses too few
      # commands, and typecheck/test catch anything that slips past that.
      - name: Typecheck
        if: steps.diff.outputs.changed == 'true'
        run: npm run typecheck

      - name: Test
        if: steps.diff.outputs.changed == 'true'
        run: npm test

      - name: Commit refreshed data
        if: steps.diff.outputs.changed == 'true' && github.event.inputs.commit != 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/eql-wiki
          rev=$(node -e "process.stdout.write(String(require('./src/data/eql-wiki/manifest.json').wikiRevisionId))")
          git commit -m "chore: refresh EQL Wiki commands data snapshot (wiki rev ${rev})"
          # The branch may have moved during extraction (e.g. a human push;
          # workflow pushes are serialized by the concurrency group); rebase
          # our snapshot commit onto the current tip and re-validate the
          # combined tree before pushing it.
          git pull --rebase origin "$GITHUB_REF_NAME"
          npm run typecheck && npm test
          git push
